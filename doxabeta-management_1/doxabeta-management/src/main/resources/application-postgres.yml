# "postgres" profile — overrides/extends application.yml's defaults for
# running against a real PostgreSQL database instead of in-memory H2.
#
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# (or set SPRING_PROFILES_ACTIVE=postgres as an environment variable, which
# is the usual approach on a hosting platform like Render or Railway).
#
# Spring merges this file's keys on top of application.yml's — anything not
# overridden here (server.port, app.cors.*, app.security.*, springdoc.*)
# still comes from application.yml.

spring:
  datasource:
    # Prefer Spring Boot's standard datasource env names when they are set.
    # On hosted providers such as Render, the connection string often arrives
    # as DATABASE_URL=postgres://... rather than a JDBC URL. The runtime
    # container normalizes that form automatically, and the value can also be
    # supplied explicitly as JDBC_DATABASE_URL for the cleanest setup.
    url: ${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/doxabeta}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${POSTGRES_USER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${POSTGRES_PASSWORD:postgres}}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  jpa:
    hibernate:
      # Same auto-migration behavior as the H2 profile — see the comment in
      # application.yml for the caveat about this vs. a real migration tool.
      ddl-auto: update
    show-sql: false
    # Same reasoning as application.yml — see that file's comment.
    open-in-view: false
    properties:
      hibernate:
        # Tells Hibernate to generate PostgreSQL-flavored SQL (data types,
        # syntax quirks, etc.) instead of the H2 dialect used by default.
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      # No H2 database in this profile, so there's nothing for the H2 console
      # to connect to — explicitly disabled to avoid a confusing dead page.
      enabled: false
